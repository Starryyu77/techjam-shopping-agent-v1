name: Deploy judge-facing evidence tour

on:
  push:
    branches: [feature/aggressive-v2]
    paths:
      - ".github/workflows/pages.yml"
      - "demo/canonical_cases.json"
      - "demo/evidence/**"
      - "demo/static/tour.*"
      - "scripts/build_static_site.py"
      - "tests/test_static_site.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify static bundle contract
        run: python -m unittest discover -s tests -p 'test_static_site.py' -v

      - name: Build static site
        run: python scripts/build_static_site.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
