<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TikTok Shop · Ads Dashboard</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .wrap{max-width:1100px;margin:0 auto;padding:22px;overflow:auto;flex:1 1 auto;min-height:0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .on{color:var(--soft)} .off{color:var(--neg)}
  .bid{font-variant-numeric:tabular-nums}
  .section-title{font-weight:650;font-size:13px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);margin:0 0 14px}
  .updated{color:var(--muted);font-size:11px;margin-left:10px;font-weight:400;text-transform:none;letter-spacing:0}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span> TikTok Shop <span style="color:var(--muted);font-weight:400">·</span> Ads Dashboard</div>
  <div class="sub">Advertiser metrics overview · auto-refreshes every 3 s</div>
  <a class="reset" href="/" style="text-decoration:none;margin-left:auto">← Shopper view</a>
  <a class="reset" href="/ads" target="_blank" style="text-decoration:none">Ad Console</a>
</header>
<div class="wrap">
  <div id="kpis" class="kpi-grid"></div>
  <div class="section-title">Campaigns by spend <span class="updated" id="updatedAt"></span></div>
  <div class="card" style="padding:0;overflow:auto">
    <table>
      <thead>
        <tr>
          <th>Advertiser</th><th>Product</th><th>Bid</th><th>Impr.</th><th>Clicks</th>
          <th>Spend / Budget</th><th>Last eCPM</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function kpiCard(value, label) {
  return '<div class="kpi-card"><div class="kpi-value">' + esc(value) + '</div><div class="kpi-label">' + esc(label) + '</div></div>';
}
async function load() {
  try {
    const d = await (await fetch("/api/ads")).json();
    const camps = d.campaigns || [];

    // KPI calculations
    const total = camps.length;
    const active = camps.filter(c => c.active).length;
    const totalImpr = camps.reduce((s, c) => s + (c.impressions || 0), 0);
    const totalSpend = camps.reduce((s, c) => s + Number(c.spend || 0), 0);
    const totalBudgetRemaining = camps.reduce((s, c) => s + Math.max(0, Number(c.budget || 0) - Number(c.spend || 0)), 0);
    const served = camps.filter(c => c.last_relevance != null);
    const avgRel = served.length > 0
      ? served.reduce((s, c) => s + Number(c.last_relevance), 0) / served.length
      : null;

    $("kpis").innerHTML =
      kpiCard(total, "Total Campaigns") +
      kpiCard(active, "Active") +
      kpiCard(totalImpr.toLocaleString(), "Impressions") +
      kpiCard("$" + totalSpend.toFixed(2), "Total Spend") +
      kpiCard("$" + totalBudgetRemaining.toFixed(2), "Remaining Budget") +
      kpiCard(avgRel != null ? Math.round(avgRel * 100) + "%" : "—", "Avg Relevance");

    // Sort by spend descending
    const sorted = [...camps].sort((a, b) => Number(b.spend || 0) - Number(a.spend || 0));
    const rows = $("rows");
    rows.innerHTML = "";
    sorted.forEach(c => {
      const spend = Number(c.spend || 0);
      const budget = Number(c.budget || 0);
      const pct = budget > 0 ? Math.min(100, spend / budget * 100) : 0;
      const ecpmText = c.last_ecpm != null ? "$" + Number(c.last_ecpm).toFixed(2) : "—";
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(c.advertiser) + "</td>" +
        "<td>" + esc((c.title || "").slice(0, 42)) + "</td>" +
        "<td class='bid'>$" + Number(c.bid).toFixed(2) + "</td>" +
        "<td>" + (c.impressions || 0) + "</td>" +
        "<td>" + (c.clicks || 0) + "</td>" +
        "<td><span>$" + spend.toFixed(2) + " / $" + budget.toFixed(0) + "</span>" +
          "<div class='prog-bar'><div class='prog-fill' style='width:" + pct + "%'></div></div></td>" +
        "<td>" + ecpmText + "</td>" +
        "<td class='" + (c.active ? "on" : "off") + "'>" + (c.active ? "active" : "paused") + "</td>";
      rows.appendChild(tr);
    });

    $("updatedAt").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    console.error("Dashboard fetch error:", e);
  }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
